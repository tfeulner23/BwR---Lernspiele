<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173d35"><title>Leihverpackungen-Check · Courtline</title>
<style>
:root{--ink:#173d35;--muted:#53685f;--paper:#f5f7f2;--line:#cad5ca;--accent:#d9ef91;--good:#24633c;--bad:#9b302d}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif;line-height:1.5}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #1d719d;outline-offset:3px}header{max-width:1020px;margin:auto;padding:22px 28px 15px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);gap:15px}.brand{font-size:24px;font-weight:800;font-style:italic;letter-spacing:-1px}.brand span{display:inline-block;width:19px;height:5px;transform:skew(-30deg);background:#9fc526;vertical-align:super;margin-left:4px}.progress{font-size:14px;color:var(--muted);text-align:right}main{max-width:960px;margin:0 auto;padding:25px 28px 35px}.eyebrow{text-transform:uppercase;font-size:13px;letter-spacing:1.3px;color:var(--muted);font-weight:bold;margin:0 0 7px}h1{font-size:clamp(28px,4vw,36px);line-height:1.18;margin:0 0 15px}h2{font-size:22px;margin:0 0 12px}p{margin:0 0 15px}.task{font-size:18px;line-height:1.55;background:#fff;border-left:4px solid #96b35b;padding:18px 22px;margin:18px 0 10px}.unpaid{font-size:15px;color:var(--muted);margin:10px 0 24px}.instruction{font-size:16px;margin:18px 0}.rows{border-top:1px solid var(--line)}.booking-row{display:grid;grid-template-columns:minmax(220px,1.6fr) minmax(154px,.9fr) minmax(135px,.8fr);gap:16px;padding:16px 0;border-bottom:1px solid var(--line);align-items:start}.field label,.field legend{display:block;font-size:13px;font-weight:bold;margin-bottom:6px;color:var(--muted)}fieldset{border:0;padding:0;margin:0;min-width:0}select,input{width:100%;border:1.5px solid #a8b8a7;border-radius:8px;background:white;color:var(--ink);min-height:49px;font-size:17px;padding:10px 12px}select{padding-right:28px}input{padding-right:30px;font-variant-numeric:tabular-nums}.amount{position:relative}.euro{position:absolute;right:12px;top:11px;color:var(--muted);pointer-events:none}.side{display:flex;gap:6px}.side button{min-height:49px;flex:1;border:1.5px solid #a8b8a7;border-radius:8px;background:#fff;color:var(--ink);padding:9px 12px}.side button[aria-pressed=true]{background:var(--ink);color:white;border-color:var(--ink);font-weight:bold}.error{font-size:14px;color:var(--bad);margin:6px 0 0;line-height:1.4}.invalid{border-color:var(--bad)!important}.invalid-group button{border-color:var(--bad)}.valid{border-color:var(--good)}.actions{display:flex;gap:14px;flex-wrap:wrap;margin:23px 0 17px;align-items:center}.primary{min-height:51px;border:0;border-radius:9px;background:var(--ink);color:white;font-size:18px;font-weight:bold;padding:12px 27px}.secondary{min-height:46px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--muted);padding:9px 16px}.feedback{padding:14px 18px;border-radius:8px;line-height:1.5}.feedback:empty{display:none}.feedback.bad{background:#faeae6;color:#772623}.success{margin:20px 0;background:#e8f3df;border:2px solid #8bb46a;border-radius:12px;padding:22px 25px;display:flex;gap:25px;align-items:center}.letter{flex:none;font-size:70px;font-weight:800;background:white;border:1.5px solid #8bb46a;border-radius:8px;width:105px;height:110px;display:grid;place-items:center;line-height:1}.success h2{color:var(--good);font-size:25px}.success p{margin-bottom:4px}.local-note{font-size:13px;color:var(--muted);margin:24px 0 0}footer{max-width:960px;margin:auto;padding:14px 28px 25px;color:var(--muted);font-size:12px}.station-links{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:25px 0}.station-links a{text-decoration:none;border:1px solid #a8b8a7;border-radius:10px;background:#fff;color:var(--ink);padding:20px 10px;text-align:center;font-weight:bold}.station-links strong{display:block;font-size:30px}.back{color:var(--muted);font-size:14px;display:inline-block;margin-top:10px}[hidden]{display:none!important}@media(max-width:650px){header{padding:17px 18px}.brand{font-size:21px}main{padding:22px 18px 30px}.task{font-size:17px;padding:15px}.booking-row{grid-template-columns:1fr 1fr;gap:12px}.booking-row>.field:first-child{grid-column:1/-1}.station-links{grid-template-columns:repeat(3,1fr)}.success{padding:18px;gap:16px}.letter{width:75px;height:90px;font-size:60px}.success h2{font-size:22px}footer{padding-left:18px}.progress{font-size:12px}.side button{padding-left:8px;padding-right:8px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body><header><div class="brand">Courtline<span></span></div><div class="progress" id="progress"></div></header><main id="app"></main><footer>BwR 8 (II) · Beschaffung und Einsatz von Werkstoffen · Fiktive Geschäftsfälle</footer>
<script>
'use strict';
const TASKS=[{"task":1,"letter":"T","text":"Courtline sendet Leihboxen einer <b>Carbon-Gewebe-Lieferung</b> zurück. Die Spedition erteilt eine Gutschrift über <b>50,00 € netto zuzüglich 19 % Umsatzsteuer</b>.","debits":[{"account":"4400 VE","cents":5950}],"credits":[{"account":"6001 BZKR","cents":5000},{"account":"2600 VORST","cents":950}],"original_invoice_unpaid":true},{"task":2,"letter":"K","text":"Courtline gibt die Leihbehälter einer <b>Lacklieferung für die Schlägerfertigung</b> zurück. Dafür erhält Courtline eine Gutschrift über <b>100,00 € netto zuzüglich 19 % Umsatzsteuer</b>.","debits":[{"account":"4400 VE","cents":11900}],"credits":[{"account":"6021 BZKH","cents":10000},{"account":"2600 VORST","cents":1900}],"original_invoice_unpaid":true},{"task":3,"letter":"E","text":"Courtline sendet die Leihbehälter einer <b>Maschinenöl-Lieferung für die Fertigungsanlagen</b> zurück. Die Spedition schreibt <b>20,00 € netto zuzüglich 19 % Umsatzsteuer</b> gut.","debits":[{"account":"4400 VE","cents":2380}],"credits":[{"account":"6031 BZKB","cents":2000},{"account":"2600 VORST","cents":380}],"original_invoice_unpaid":true},{"task":4,"letter":"S","text":"Für eine Lieferung <b>vorgefertigter Griffkappen</b> für die Schlägerproduktion erhält Courtline eine Speditionsrechnung: <b>100,00 € netto Fracht</b> und <b>50,00 € netto Leihverpackung</b>, jeweils <b>zuzüglich 19 % Umsatzsteuer</b>. Buche diese Rechnung.","debits":[{"account":"6011 BZKF","cents":15000},{"account":"2600 VORST","cents":2850}],"credits":[{"account":"4400 VE","cents":17850}],"original_invoice_unpaid":true},{"task":5,"letter":"I","text":"Die Leihverpackung aus <b>Aufgabe 4</b> wird zurückgeschickt. Courtline erhält dafür eine Gutschrift über <b>50,00 € netto zuzüglich 19 % Umsatzsteuer</b>. Buche die Gutschrift.","debits":[{"account":"4400 VE","cents":5950}],"credits":[{"account":"6011 BZKF","cents":5000},{"account":"2600 VORST","cents":950}],"original_invoice_unpaid":true}];
const ACCOUNTS=[['6001 BZKR','Rohstoffe'],['6011 BZKF','Fremdbauteile'],['6021 BZKH','Hilfsstoffe'],['6031 BZKB','Betriebsstoffe'],['2600 VORST','Vorsteuer'],['4400 VE','Verbindlichkeiten']];
const KEY='courtline-leihverpackungen-check-v1';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const blankRows=()=>Array.from({length:3},()=>({account:'',side:'',amount:''}));
let store={version:1,tasks:{}},active=0;
function parseCents(value){
 let s=String(value).trim().replace(/[€\s\u00a0]/g,'');if(!/^\d[\d.,]*$/.test(s))return null;
 let integer,fraction='';
 if(s.includes(',')){if((s.match(/,/g)||[]).length!==1)return null;[integer,fraction]=s.split(',');if(!/^\d{1,2}$/.test(fraction))return null;if(integer.includes('.')&&!/^\d{1,3}(?:\.\d{3})+$/.test(integer))return null;integer=integer.replaceAll('.','');}
 else if(s.includes('.')){if(/^\d+\.\d{1,2}$/.test(s)){[integer,fraction]=s.split('.');}else if(/^\d{1,3}(?:\.\d{3})+$/.test(s)){integer=s.replaceAll('.','');}else return null;}
 else integer=s;
 if(!/^\d+$/.test(integer))return null;const cents=Number(integer)*100+Number(fraction.padEnd(2,'0'));return Number.isSafeInteger(cents)&&cents>0&&cents<=100000000?cents:null;
}
function formatCents(cents){return (cents/100).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2});}
function expectedRows(task){return [...task.debits.map(r=>({...r,side:'soll'})),...task.credits.map(r=>({...r,side:'haben'}))];}
function evaluate(task,rows){
 const expected=expectedRows(task),counts={};rows.forEach(r=>{if(r.account)counts[r.account]=(counts[r.account]||0)+1;});
 const errors=rows.map(r=>{const e={};const target=expected.find(t=>t.account===r.account);
  if(!r.account)e.account='Wähle ein Konto aus.';else if(!target)e.account='Dieses Konto passt nicht. Prüfe die Werkstoffart und den Geschäftsvorfall.';else if(counts[r.account]>1)e.account='Dieses Konto ist doppelt gewählt. Verwende jedes Konto nur einmal.';
  if(!r.side)e.side='Wähle Soll oder Haben.';else if(target&&r.side!==target.side)e.side=task.task===4?'Beim Rechnungseingang steigen Bezugskosten, Vorsteuer und Verbindlichkeit. Prüfe die Buchungsseite.':r.account==='4400 VE'?'Die Gutschrift vermindert die Verbindlichkeit. Prüfe die Buchungsseite.':'Die Gutschrift vermindert den bereits gebuchten Aufwand und die Vorsteuer. Prüfe die Buchungsseite.';
  const amount=parseCents(r.amount);if(amount===null)e.amount='Trage einen gültigen Betrag ein, z. B. 59,50.';else if(target&&amount!==target.cents)e.amount=task.task===4?'Prüfe Fracht plus Leihverpackung sowie 19 % Vorsteuer und den Gesamtbetrag.':'Prüfe den Nettobetrag der Gutschrift, 19 % Vorsteuer und den Gesamtbetrag.';
  return e;
 });return {correct:rows.length===3&&errors.every(e=>Object.keys(e).length===0),errors};
}
function load(){try{const parsed=JSON.parse(localStorage.getItem(KEY));if(parsed&&parsed.version===1&&parsed.tasks){for(const task of TASKS){const old=parsed.tasks[task.task];if(old&&Array.isArray(old.rows)&&old.rows.length===3){const rows=old.rows.map(r=>({account:ACCOUNTS.some(a=>a[0]===r.account)?r.account:'',side:['soll','haben'].includes(r.side)?r.side:'',amount:typeof r.amount==='string'?r.amount.slice(0,25):''}));store.tasks[task.task]={rows,correct:old.correct===true&&evaluate(task,rows).correct};}}}}catch{} }
function save(){try{localStorage.setItem(KEY,JSON.stringify(store));}catch{}}
function entry(id){return store.tasks[id]||(store.tasks[id]={rows:blankRows(),correct:false});}
function progress(){const done=TASKS.filter(t=>entry(t.task).correct).length;$('progress').textContent=done+' von 5 Aufgaben richtig';return done;}
function errorText(i,field,message=''){$(`${field}-error-${i}`).textContent=message;const el=$(field==='side'?`side-${i}`:`${field}-${i}`);el.classList.toggle(field==='side'?'invalid-group':'invalid',!!message);if(field!=='side')el.setAttribute('aria-invalid',message?'true':'false');}
function clearFeedback(){for(let i=0;i<3;i++)for(const f of ['account','side','amount'])errorText(i,f);$('feedback').className='feedback';$('feedback').textContent='';$('success').hidden=true;}
function changed(){entry(active).correct=false;save();clearFeedback();progress();}
function rowHTML(r,i){return `<div class="booking-row"><div class="field"><label for="account-${i}">Konto · Zeile ${i+1}</label><select id="account-${i}" aria-describedby="account-error-${i}"><option value="">Bitte wählen …</option>${ACCOUNTS.map(([a,label])=>`<option value="${a}" ${r.account===a?'selected':''}>${a} · ${label}</option>`).join('')}</select><p class="error" id="account-error-${i}"></p></div><fieldset class="field"><legend>Buchungsseite · Zeile ${i+1}</legend><div class="side" id="side-${i}"><button type="button" data-row="${i}" data-side="soll" aria-pressed="${r.side==='soll'}">Soll</button><button type="button" data-row="${i}" data-side="haben" aria-pressed="${r.side==='haben'}">Haben</button></div><p class="error" id="side-error-${i}"></p></fieldset><div class="field"><label for="amount-${i}">Betrag · Zeile ${i+1}</label><div class="amount"><input id="amount-${i}" inputmode="decimal" type="text" autocomplete="off" maxlength="25" placeholder="0,00" value="${esc(r.amount)}" aria-describedby="amount-error-${i}"><span class="euro">€</span></div><p class="error" id="amount-error-${i}"></p></div></div>`;}
function showSuccess(task){$('success').hidden=false;$('letter').textContent=task.letter;$('success-title').textContent='Richtig!';$('success-text').textContent='Trage den Buchstaben bei Aufgabe '+task.task+' auf deinem Arbeitsblatt ein.';const count=progress();$('done-note').textContent=count===5?'Alle fünf Aufgaben sind kontrolliert. Setze das Lösungswort auf deinem Arbeitsblatt zusammen.':'Zurück zum Arbeitsblatt: Löse die nächste Aufgabe und scanne ihre Station.';}
function check(){const task=TASKS.find(t=>t.task===active),data=entry(active);clearFeedback();const result=evaluate(task,data.rows);data.correct=result.correct;save();progress();if(result.correct){showSuccess(task);}else{result.errors.forEach((e,i)=>Object.entries(e).forEach(([f,m])=>errorText(i,f,m)));$('feedback').className='feedback bad';$('feedback').textContent='Noch nicht ganz. Prüfe die Hinweise unter deinen Eingaben und versuche es erneut.';}}
function renderTask(id){active=id;const task=TASKS.find(t=>t.task===id),data=entry(id);$('app').innerHTML=`<p class="eyebrow">QR-Station ${id}</p><h1>Kontrolle zu Aufgabe ${id}</h1><div class="task">${task.text}</div>${id===5?'<p class="unpaid">Bezug zu Aufgabe 4: Lieferung vorgefertigter Griffkappen.</p>':''}<p class="unpaid"><u>Alle ursprünglichen Rechnungen sind noch nicht bezahlt.</u></p><h2>Dein Buchungssatz</h2><p class="instruction">Wähle die drei Konten und die jeweilige Buchungsseite. Trage die Beträge ein. Die Reihenfolge der Zeilen ist frei.</p><form id="booking-form" novalidate><div class="rows">${data.rows.map(rowHTML).join('')}</div><div class="actions"><button class="primary" type="submit">Buchung prüfen</button><button class="secondary" type="button" id="clear-task">Eingaben leeren</button></div></form><div id="feedback" class="feedback" role="status" aria-live="polite"></div><section id="success" class="success" hidden aria-live="polite"><div id="letter" class="letter"></div><div><h2 id="success-title"></h2><p id="success-text"></p><p id="done-note"></p></div></section><p class="local-note">Deine Eingaben und richtigen Lösungen bleiben auf diesem iPad in diesem Browser gespeichert.</p>`;
 for(let i=0;i<3;i++){$(`account-${i}`).addEventListener('change',e=>{data.rows[i].account=e.target.value;changed();});$(`amount-${i}`).addEventListener('input',e=>{data.rows[i].amount=e.target.value;changed();});$(`amount-${i}`).addEventListener('blur',e=>{const n=parseCents(e.target.value);if(n!==null){e.target.value=formatCents(n);data.rows[i].amount=e.target.value;save();}});}
 document.querySelectorAll('[data-side]').forEach(button=>button.addEventListener('click',()=>{const row=Number(button.dataset.row);data.rows[row].side=button.dataset.side;document.querySelectorAll(`[data-row="${row}"]`).forEach(b=>b.setAttribute('aria-pressed',String(b===button)));changed();}));
 $('booking-form').addEventListener('submit',e=>{e.preventDefault();check();});$('clear-task').addEventListener('click',()=>{store.tasks[id]={rows:blankRows(),correct:false};save();renderTask(id);progress();});if(data.correct)showSuccess(task);progress();
}
function renderHome(){active=0;$('app').innerHTML='<p class="eyebrow">Digitale Selbstkontrolle</p><h1>Leihverpackungen-Check</h1><p>Löse die Aufgaben zuerst auf deinem Arbeitsblatt. Scanne danach den QR-Code der passenden Station und prüfe deinen Buchungssatz.</p><div class="station-links">'+TASKS.map(t=>`<a href="#${t.task}"><strong>${t.task}</strong>Aufgabe ${t.task}</a>`).join('')+'</div><p>Eine vollständig richtige Buchung gibt dir einen Buchstaben für dein Lösungswort.</p><p class="local-note">Keine Anmeldung nötig. Deine Eingaben bleiben auf diesem iPad in diesem Browser gespeichert.</p>';progress();}
function route(){const hash=location.hash.slice(1);if(/^[1-5]$/.test(hash))renderTask(Number(hash));else renderHome();}
load();window.addEventListener('hashchange',route);route();
</script></body></html>
