<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123d39"><title>Courtline Factory – Material für die Fertigung</title>
<style>
:root{--ink:#143d39;--green:#1b6656;--mint:#def2e9;--paper:#f5f8f7;--line:#cddcd6;--muted:#526a64;--orange:#9b4d08;--red:#a52827}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:18px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{min-height:48px;border-radius:12px;border:1px solid var(--line);padding:12px 20px;background:white;color:var(--ink);cursor:pointer;font-weight:700}button:hover{border-color:var(--green);background:#edf5f0}button:focus-visible{outline:3px solid #b77624;outline-offset:3px}button:disabled{cursor:default;opacity:.55}.primary{background:var(--green);border-color:var(--green);color:white}.primary:hover{background:#114e40;color:white}.quiet{font-weight:500;font-size:15px;padding:8px 12px;min-height:42px}header{max-width:1180px;margin:auto;display:flex;justify-content:space-between;align-items:center;padding:18px 24px;border-bottom:1px solid var(--line)}.brand{font-size:23px;font-weight:850;letter-spacing:-.6px}.brand span{font-weight:450}main{max-width:1180px;margin:auto;padding:28px 24px 40px}h1{font-size:clamp(34px,5vw,56px);line-height:1.08;letter-spacing:-1.7px;margin:12px 0 20px}h2{font-size:clamp(25px,3.4vw,35px);line-height:1.18;margin:8px 0 20px}h3{font-size:20px;margin:0 0 10px}p{margin:10px 0 20px}.eyebrow{font-size:15px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:1.1px}.lead{font-size:22px;max-width:830px}.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.spread{justify-content:space-between}.intro{display:grid;grid-template-columns:1.35fr .65fr;gap:36px;align-items:center}.letter{background:white;border-left:5px solid var(--green);padding:24px 28px;margin:24px 0}.letter p{margin:0 0 14px}.letter p:last-child{margin:0}.subtle{color:var(--muted)}.small{font-size:15px}.mission{background:var(--ink);color:white;padding:22px 26px;border-radius:16px;margin-bottom:24px}.mission .eyebrow{color:#bce0d1}.mission p{margin:8px 0 0}.choices{display:grid;gap:14px;grid-template-columns:repeat(3,1fr);margin:24px 0}.choices button{font-size:24px;padding:22px 12px}.choices button small{font-size:15px;display:block;font-weight:450}.daystrip{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:18px 0 24px}.day{padding:12px 8px;text-align:center;border:1px solid var(--line);border-radius:10px;background:white;font-size:16px}.day b{display:block}.day.current{background:var(--ink);color:white;border-color:var(--ink)}.day.done{background:var(--mint)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:22px 0}.stat{padding:15px 18px;background:white;border:1px solid var(--line);border-radius:12px}.stat b{display:block;font-size:30px;line-height:1.3}.stat span{font-size:15px}.factory{background:#fff;position:relative;border:1px solid var(--line);border-radius:18px;padding:20px;min-height:235px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px;align-items:center;overflow:hidden}.zone{text-align:center;position:relative}.zone h3{font-size:18px}.truck{font-size:62px;display:block;transition:transform .6s}.active .truck{animation:drive .7s ease-out}.machine{font-size:67px;display:block}.active .machine{animation:pulse .6s ease-in-out}.crates{display:grid;grid-template-columns:repeat(5,16px);gap:5px;justify-content:center;min-height:66px;align-content:center}.crate{height:16px;background:#4b9b7e;border:1px solid #28684f;border-radius:3px}.crate.reserve{background:#e7aa45;border-color:#946422}.storage-label{font-size:15px;color:var(--muted)}.alert{margin:18px 0;padding:17px 20px;border-radius:12px;background:#fff0dc;border:1px solid #e4bf84;color:#713a06}.feedback{padding:15px 18px;background:var(--mint);border:1px solid #9ac8b2;border-radius:12px;margin:18px 0}.feedback.bad{background:#fff0ee;border-color:#d7a49e;color:#8d2925}.feedback p{margin:0}.note{font-size:15px;color:var(--muted);max-width:920px;margin-top:20px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0}.tablewrap{overflow:auto;background:white;border:1px solid var(--line);border-radius:12px;margin:20px 0}table{border-collapse:collapse;width:100%;min-width:560px;font-size:17px}th,td{padding:15px 16px;border-bottom:1px solid var(--line);text-align:left}th{background:#eaf2ee;font-weight:750}tr:last-child td{border-bottom:0}.highlight{background:#e7f3e9}.definition{font-size:22px;border-left:5px solid var(--green);padding:12px 22px;background:white;margin:22px 0}.options{display:grid;gap:12px;max-width:950px;margin:20px 0}.options button{text-align:left;font-weight:550}.options button.correct{background:#d8efdf;border-color:#4d966d}.options button.wrong{background:#fde3df;border-color:#b75e53}.resultgrid{display:grid;grid-template-columns:1fr 1fr;gap:24px}.badge{display:inline-block;background:var(--mint);font-size:15px;font-weight:750;padding:6px 11px;border-radius:6px}footer{max-width:1180px;margin:auto;padding:15px 24px 28px;font-size:14px;color:var(--muted)}.padel{font-size:115px;text-align:center;background:var(--mint);border-radius:50%;width:220px;height:220px;display:grid;place-items:center;margin:auto}.progress{font-size:15px;color:var(--muted)}.correcttext{color:#246741}.topgap{margin-top:28px}@keyframes drive{from{transform:translateX(-65px)}to{transform:translateX(0)}}@keyframes pulse{50%{transform:scale(1.08)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}@media(max-width:750px){main{padding:22px 16px}.intro{grid-template-columns:1fr}.intro .padel{display:none}.stats{grid-template-columns:1fr 1fr}.resultgrid{grid-template-columns:1fr}.factory{padding:15px 8px;gap:6px;min-height:210px}.truck,.machine{font-size:47px}.day{font-size:14px;padding:9px 3px}.stat{padding:12px}.stat b{font-size:26px}.choices{grid-template-columns:1fr 1fr}.letter{padding:19px}.lead{font-size:20px}header{padding:14px 16px}.crates{grid-template-columns:repeat(5,12px);gap:3px}.crate{height:12px}}@media(max-width:420px){.factory{grid-template-columns:1fr}.zone:first-child{display:none}.zone{display:flex;justify-content:space-around;align-items:center}.zone h3{margin:0}.machine{font-size:42px}.choices{grid-template-columns:1fr}}
</style></head><body><header><div class="brand">Courtline <span>Factory</span></div><button class="quiet" id="reset">Neu starten</button></header><main id="app"></main><footer>Fiktives Modellunternehmen · BwR 8 (II) · Fortschritt nur in diesem Browser. Keine Anmeldung.</footer>
<script>
/* MODEL_START */
const Model=(()=>{
 const DAYS=['Montag','Dienstag','Mittwoch','Donnerstag','Freitag'],DEMAND=[4,4,4,4,4];
 function plan(mode,reserve=0,delay=true){
  if(!['stock','flow'].includes(mode)||![0,2,4,8].includes(reserve))throw Error('Ungültiger Plan');
  let stock=reserve,finished=0,missed=0,cost=0,deliveries=reserve>0?1:0;
  const days=DEMAND.map((need,i)=>{
   const scheduled=mode==='stock'?(i===0?20:0):4;
   const arrived=mode==='stock'?scheduled:(delay&&i===2?0:(delay&&i===3?8:4));
   const event=delay&&i===2;
   stock+=arrived;if(arrived)deliveries+=(mode==='flow'&&delay&&i===3?2:1);
   const before=stock,made=Math.min(stock,need),lost=need-made;
   stock-=made;finished+=made;missed+=lost;cost+=stock;
   return {day:DAYS[i],need,scheduled,arrived,event,before,made,lost,end:stock,finished,missed,cost,deliveries};
  });
  return{mode,reserve,delay,days,finished,missed,cost,deliveries,stock};
 }
 return{DAYS,DEMAND,plan};
})();globalThis.CourtlineModel=Model;
/* MODEL_END */
const KEY='courtline-factory-v1',app=document.getElementById('app');
const blank=()=>({stage:'intro',day:0,phase:'arrive',stock:null,flow:null,reserve:null,buffer:null,answers:[null,null,null],tries:[0,0,0],msg:''});
let st=blank();try{const a=JSON.parse(localStorage.getItem(KEY));if(a&&a.version===1&&['intro','plan','stock','stockDone','flowIntro','flow','compare','reserve','reserveDone','cases','done'].includes(a.stage))st={...blank(),...a,msg:''};}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify({...st,version:1,msg:''}));}catch(e){}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function go(stage){st.stage=stage;st.msg='';save();render();scrollTo({top:0,behavior:'smooth'});}
const stats=(r)=>`<div class="stats"><div class="stat"><span>Fertige Schläger</span><b>${r.finished} / 20</b></div><div class="stat"><span>Nicht rechtzeitig fertig</span><b>${r.missed}</b></div><div class="stat"><span>Lagerpunkte</span><b>${r.cost}</b></div><div class="stat"><span>Lieferungen</span><b>${r.deliveries}</b></div></div>`;
function comparison(reserve=false){const a=Model.plan('stock'),b=Model.plan('flow');return`<div class="tablewrap"><table><thead><tr><th>Plan</th><th>Fertige Schläger</th><th>Lagerpunkte</th><th>Lieferungen</th></tr></thead><tbody><tr><td>Auf Vorrat</td><td>${a.finished} / 20</td><td>${a.cost}</td><td>${a.deliveries}</td></tr><tr><td>Passend zur Fertigung</td><td>${b.finished} / 20</td><td>${b.cost}</td><td>${b.deliveries}</td></tr>${reserve&&st.reserve!==null?`<tr class="highlight"><td>Mit ${st.buffer} Kernen Reserve</td><td>${st.reserve.finished} / 20</td><td>${st.reserve.cost}</td><td>${st.reserve.deliveries}</td></tr>`:''}</tbody></table></div>`;}
const ledger=(r)=>`<div class="tablewrap"><table><thead><tr><th>Tag</th><th>Geliefert</th><th>Fertig</th><th>Zu spät</th><th>Rest im Lager</th></tr></thead><tbody>${r.days.map(d=>`<tr><td>${d.day}</td><td>${d.arrived}</td><td>${d.made}</td><td>${d.lost}</td><td>${d.end}</td></tr>`).join('')}</tbody></table></div>`;
const modelnote=`<p class="note">Unser vereinfachtes Modell: 1 Kern ergibt 1 Schläger. Jeder Kern, der am Tagesende im Lager liegt, zählt als 1 Lagerpunkt. Andere Werkstoffe sind vorhanden. Fertigungskapazität: 4 Schläger pro Tag. Versäumte Tagesaufträge können später nicht nachgeholt werden. Transportkosten sind nicht in den Lagerpunkten enthalten.</p>`;
function round(){
 const mode=st.stage==='stock'?'stock':'flow',r=Model.plan(mode),d=r.days[st.day],prev=st.day?r.days[st.day-1]:{end:0,finished:0,missed:0,cost:0,deliveries:0};
 const produced=st.phase==='produced';const show=produced?d:{...prev,finished:prev.finished,missed:prev.missed,cost:prev.cost,deliveries:st.phase==='arrived'?d.deliveries:prev.deliveries};
 const amount=produced?d.end:st.phase==='arrived'?d.before:prev.end;
 const delivery=st.phase!=='arrive';
 return`<div class="eyebrow">Durchlauf ${mode==='stock'?'1 · Auf Vorrat':'2 · Passend zur Fertigung'}</div><h1>${d.day}: 4 Schläger werden gebraucht.</h1><div class="daystrip">${Model.DAYS.map((x,i)=>`<div class="day ${i===st.day?'current':i<st.day?'done':''}"><b>${x}</b>4 Schläger</div>`).join('')}</div><div class="factory ${delivery?'active':''}"><div class="zone"><h3>Lieferer</h3><span class="truck" aria-hidden="true">🚚</span><span class="storage-label">Geplant: ${d.scheduled} Kerne heute</span></div><div class="zone"><h3>Lager: ${amount} Kerne</h3><div class="crates" aria-hidden="true">${Array.from({length:amount},()=>'<i class="crate"></i>').join('')}</div><span class="storage-label">Material für eure Schläger</span></div><div class="zone"><h3>Fertigung</h3><span class="machine" aria-hidden="true">⚙️</span><span class="storage-label">Heute benötigt: 4 Kerne</span></div></div>${d.event&&delivery?`<div class="alert"><b>Stau am Mittwoch!</b> ${mode==='stock'?'Heute wäre die Zufahrt verspätet erreichbar. Eure Sammellieferung ist bereits seit Montag im Lager.':'Die heutigen 4 Kerne kommen erst am Donnerstag. Die Maschine kann nur fertigen, was jetzt im Lager liegt.'}</div>`:''}${delivery?`<p><b>Heute angekommen: ${d.arrived} Kerne.</b> ${mode==='flow'&&st.day===3?'Die Lieferung vom Mittwoch kommt zusammen mit der planmäßigen Donnerstagslieferung.':''}</p>`:''}${produced?`<div class="feedback ${d.lost?'bad':''}"><b>${d.made} Schläger fertig.</b> ${d.lost?`${d.lost} Schläger fehlen zum Tagesende.`:'Der Tagesauftrag ist erfüllt.'} Am Tagesende bleiben ${d.end} Kerne: +${d.end} Lagerpunkte.</div>`:''}${stats(show)}<div class="actions"><button class="primary" data-action="${st.phase==='arrive'?'arrive':st.phase==='arrived'?'produce':'next'}">${st.phase==='arrive'?'Lieferung prüfen':st.phase==='arrived'?'Auftrag fertigen':st.day===4?'Woche auswerten':'Zum nächsten Tag'}</button></div>${modelnote}`;
}
const cases=[
 {title:'Kurze Wege, verlässliche Termine',text:'Ein Lieferer in der Nähe liefert zuverlässig. Courtline kennt den Bedarf für die kommende Woche genau.',options:['Bedarfsgerechte Lieferungen sind gut planbar.','Unzuverlässige Lieferungen spielen hier keine Rolle, weil das Lager immer leer sein muss.','Courtline benötigt zwingend den gesamten Jahresbedarf im Lager.'],right:0,reason:'Genaue Bedarfsplanung und zuverlässige Lieferungen sind wichtige Voraussetzungen für Just-in-Time.'},
 {title:'Die Liefertermine schwanken',text:'Carbon-Gewebe kommt über eine lange Strecke. Die tatsächlichen Liefertermine schwanken häufig um mehrere Tage.',options:['Courtline bestellt erst, wenn kein Material mehr da ist.','Ohne Reserve wäre Just-in-Time hier störungsanfällig. Ein größerer Vorrat kann die Fertigung absichern.','Der Lagerbestand hat keinen Einfluss auf die Fertigung.'],right:1,reason:'Schwankende Liefertermine erhöhen das Stillstandsrisiko. Rechtzeitige Bestellung und eine passende Reserve werden besonders wichtig.'},
 {title:'Eine Reserve für zwei Tage?',text:'Courtline benötigt 4 Kerne pro Tag und hält 4 Kerne als Sicherheitsbestand. Jetzt fallen die Lieferungen an zwei aufeinanderfolgenden Tagen aus.',options:['Die Reserve reicht für beide Tage.','Die Reserve kann überhaupt nicht helfen.','Die Reserve überbrückt einen Tag. Für zwei Tage wären unter diesen Annahmen 8 Kerne nötig.'],right:2,reason:'Ein Sicherheitsbestand ist begrenzt: 4 Kerne reichen bei 4 Kernen Tagesbedarf genau einen Tag.'}
];
function render(){
 let v='';
 switch(st.stage){
 case'intro':v=`<div class="intro"><div><div class="eyebrow">Ihr übernehmt die Materialversorgung</div><h1>20 Schläger.<br>Eine Woche.<br>Euer Plan.</h1><p class="lead">Haltet die Fertigung am Laufen und belegt möglichst wenig Lagerplatz.</p><div class="letter"><p><b>Von Simon Brenner · Courtline e.K.</b></p><p>„Für unsere Kunden brauchen wir jeden Tag vier Padelschläger. Alle anderen Werkstoffe sind da – kümmert ihr euch um die Schaumstoffkerne?“</p></div><button class="primary" data-action="start">Auftrag übernehmen</button></div><div class="padel" aria-hidden="true"><svg viewBox="0 0 160 200" width="130" height="160" aria-hidden="true"><ellipse cx="80" cy="65" rx="52" ry="60" fill="none" stroke="#1b6656" stroke-width="12"/><path d="M60 120L70 145H90L100 120M80 144V187" fill="none" stroke="#1b6656" stroke-width="14" stroke-linecap="round"/><g fill="#1b6656"><circle cx="58" cy="38" r="4"/><circle cx="80" cy="38" r="4"/><circle cx="102" cy="38" r="4"/><circle cx="58" cy="57" r="4"/><circle cx="80" cy="57" r="4"/><circle cx="102" cy="57" r="4"/><circle cx="58" cy="76" r="4"/><circle cx="80" cy="76" r="4"/><circle cx="102" cy="76" r="4"/><circle cx="58" cy="95" r="4"/><circle cx="80" cy="95" r="4"/><circle cx="102" cy="95" r="4"/></g></svg></div></div><p class="note">Spielt zu zweit. Eine Person liest und begründet, die andere bedient. Nach dem ersten Durchlauf tauscht ihr. Alle Daten und das Unternehmen sind fiktiv.</p>`;break;
 case'plan':v=`<div class="eyebrow">Durchlauf 1 · Auf Vorrat</div><h1>Plant die Sammellieferung.</h1><p class="lead">Courtline braucht von Montag bis Freitag jeden Tag 4 Kerne. Die gesamte Wochenmenge soll am Montag vor Produktionsbeginn eintreffen.</p><div class="daystrip">${Model.DAYS.map(x=>`<div class="day"><b>${x}</b>4 Kerne</div>`).join('')}</div><h2>Wie viele Kerne braucht die Sammellieferung?</h2><div class="choices">${[8,12,20].map(n=>`<button data-order="${n}">${n} Kerne</button>`).join('')}</div>${st.msg?`<div class="feedback bad" role="status">${st.msg}</div>`:''}${modelnote}`;break;
 case'stock':case'flow':v=round();break;
 case'stockDone':v=`<div class="eyebrow">Durchlauf 1 abgeschlossen</div><h1>Alle Aufträge geschafft.</h1>${stats(Model.plan('stock'))}<p class="lead">Der Vorrat hat die Fertigung abgesichert. Dafür lag über mehrere Tage Material im Lager.</p>${ledger(Model.plan('stock'))}<div class="actions"><button class="primary" data-action="flowintro">Zweiten Plan ausprobieren</button></div>${modelnote}`;break;
 case'flowIntro':v=`<div class="eyebrow">Durchlauf 2 · Passend zur Fertigung</div><h1>Nur das Material,<br>das ihr heute braucht.</h1><p class="lead">Jetzt sollen jeden Morgen 4 Kerne direkt vor Produktionsbeginn eintreffen. Die Aufträge und der Stau am Mittwoch bleiben gleich. Lieferungen sind im Voraus geplant – ihr bestellt nicht erst bei leerem Lager.</p><div class="mission"><h2>Beobachtet die Folgen.</h2><p>Was passiert mit den Lagerpunkten? Wie wirkt sich die verspätete Lieferung aus?</p></div><button class="primary" data-action="flowstart">Zweiten Durchlauf starten</button>${modelnote}`;break;
 case'compare':v=`<div class="eyebrow">Vergleicht eure Pläne</div><h1>Weniger Lager.<br>Mehr Abhängigkeit.</h1>${comparison()}<div class="definition"><b>Just-in-Time</b> bedeutet: Werkstoffe werden genau zu dem Zeitpunkt geliefert, zu dem sie in der Fertigung gebraucht werden. Die Beschaffung wird vorher passend geplant.</div><p class="lead">Der Stau war in beiden Wochen gleich. Bei der Vorratsbeschaffung lag das Material bereits bereit. Bei der bedarfsgerechten Lieferung fehlte es am Mittwoch.</p><div class="mission"><h3>Besprechungspause</h3><p>Tragt beide Ergebnisse auf dem Arbeitsblatt ein. Vergleicht sie gemeinsam mit eurer Lehrkraft. Die Reservenrunde startet ihr erst nach der Besprechung.</p></div><button class="primary" data-action="reserveintro">Zur Reservenrunde</button>${modelnote}`;break;
 case'reserve':v=`<div class="eyebrow">Die geheime Reserve</div><h1>Wie viel Sicherheit<br>passt in euer Lager?</h1><p class="lead">Die täglichen Lieferungen und der Stau bleiben gleich. Zusätzlich dürft ihr vor Wochenbeginn eine Reserve einlagern. Schafft alle 20 Schläger mit einer möglichst kleinen Reserve.</p><div class="choices">${[0,2,4,8].map(n=>`<button data-buffer="${n}">${n} Kerne<small>zusätzlich vor Montag</small></button>`).join('')}</div><p class="note">Die zusätzlichen Kerne werden vor Wochenbeginn einmal angeliefert. Deshalb zählt diese Variante eine Lieferung mehr. Die Reserve bleibt Teil des Lagerbestands und verursacht ebenfalls Lagerpunkte.</p>`;break;
 case'reserveDone':{const rr=st.reserve;v=`<div class="eyebrow">Euer Reserve-Test</div><h1>${rr.finished===20?'Die Fertigung läuft.':'Die Reserve reicht noch nicht.'}</h1>${stats(rr)}<div class="feedback ${rr.finished<20?'bad':''}">${rr.finished<20?`Mit ${st.buffer} Reservekernen fehlen ${rr.missed} Schläger. Überlegt, welche Menge den ausgefallenen Tagesbedarf abdeckt.`:st.buffer===4?'Mit 4 Kernen überbrückt ihr genau den ausgefallenen Tagesbedarf. Eine größere Reserve wäre für diese Störung nicht nötig.':'Mit 8 Kernen schafft ihr alle Aufträge. Für diese Störung würde auch eine kleinere Reserve ausreichen und weniger Lagerpunkte verursachen.'}</div>${comparison(true)}${ledger(rr)}<div class="definition"><b>Eiserner Bestand / Sicherheitsbestand:</b> Eine Materialreserve soll die Fertigung bei unerwarteten Lieferstörungen oder zusätzlichem Bedarf absichern. Sie überbrückt nur einen begrenzten Zeitraum.</div><div class="actions"><button data-action="reserveintro">Andere Reserve testen</button>${rr.finished===20?'<button class="primary" data-action="cases">Zu den Entscheidungsszenarien</button>':''}</div><p class="note">Übertragt euer getestetes Ergebnis auf das Arbeitsblatt. Besprecht und sichert den Sicherheitsbestand, bevor ihr mit den Fällen beginnt.</p>`;break;}
 case'cases':{const i=st.answers.findIndex(x=>x===null);if(i===-1){st.stage='done';save();return render();}const q=cases[i];v=`<div class="eyebrow">Entscheidung ${i+1} von 3</div><h1>${q.title}</h1><p class="lead">${q.text}</p><h2>Welche Einschätzung passt?</h2><div class="options">${q.options.map((t,j)=>`<button data-answer="${j}" data-case="${i}">${t}</button>`).join('')}</div>${st.msg?`<div class="feedback bad" role="status">${st.msg}</div>`:''}<p class="note">Lest den Fall zuerst allein und entscheidet. Vergleicht danach eure Begründung mit eurer Partnerin oder eurem Partner.</p>`;break;}
 case'done':v=`<div class="eyebrow">Produktions-Challenge abgeschlossen</div><h1>Ihr habt den Überblick.</h1>${comparison(true)}<div class="definition">Just-in-Time kann Lagerbestände und Lagerkosten senken. Die Fertigung ist stärker auf zuverlässige, passend geplante Lieferungen angewiesen. Ein Sicherheitsbestand kann begrenzte Störungen überbrücken.</div><h2>Eure Entscheidungen</h2>${cases.map((q,i)=>`<div class="feedback"><b>${i+1}. ${q.title}</b><p>${q.reason}</p></div>`).join('')}<div class="mission"><h3>Eure Antwort an Simon</h3><p>Formuliert eine begründete Empfehlung: Welche Materialversorgung passt zu Courtline – und unter welchen Voraussetzungen?</p></div><button data-action="compare">Ergebnisse noch einmal ansehen</button><p class="note">Die Ergebnisse bleiben in diesem Browser gespeichert. Für eine Dokumentation könnt ihr einen Screenshot machen. Es wird nichts an die Lehrkraft übertragen.</p>`;break;
 }
 app.innerHTML=v;
}
app.addEventListener('click',e=>{
 const el=e.target.closest('button');if(!el)return;
 if(el.dataset.order){if(+el.dataset.order!==20){st.msg='Rechnet den Bedarf für alle fünf Tage zusammen. Die Lieferung muss für die ganze Woche reichen.';return render();}st.day=0;st.phase='arrive';return go('stock');}
 if(el.dataset.buffer!==undefined){st.buffer=+el.dataset.buffer;st.reserve=Model.plan('flow',st.buffer);return go('reserveDone');}
 if(el.dataset.answer!==undefined){const i=+el.dataset.case,j=+el.dataset.answer;st.tries[i]++;if(j!==cases[i].right){st.msg=i===2?'Vergleicht die Reserve mit dem Bedarf für einen einzelnen Tag.':'Prüft, welche Angaben zu Bedarf und Lieferzuverlässigkeit im Fall stehen.';save();render();return;}st.answers[i]=j;st.msg='';save();app.innerHTML=`<div class="badge">Richtig begründet</div><h1>${cases[i].title}</h1><div class="feedback"><p>${cases[i].reason}</p></div><button class="primary" data-action="cases">${i===2?'Ergebnis ansehen':'Nächster Fall'}</button>`;return;}
 switch(el.dataset.action){
 case'start':return go('plan');
 case'arrive':st.phase='arrived';save();return render();
 case'produce':st.phase='produced';save();return render();
 case'next':if(st.day<4){st.day++;st.phase='arrive';save();return render();}if(st.stage==='stock'){st.stock=Model.plan('stock');return go('stockDone');}st.flow=Model.plan('flow');return go('compare');
 case'flowintro':return go('flowIntro');
 case'flowstart':st.day=0;st.phase='arrive';return go('flow');
 case'reserveintro':return go('reserve');
 case'cases':return go('cases');
 case'compare':return go('compare');
 }
});
document.getElementById('reset').addEventListener('click',()=>{if(confirm('Möchtet ihr euren Fortschritt löschen und neu beginnen?')){st=blank();save();render();scrollTo(0,0);}});
render();
</script></body></html>
