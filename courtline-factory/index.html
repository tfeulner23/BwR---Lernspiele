<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173e38"><meta name="description" content="Courtline Factory: Plane Liefermenge und Lieferrhythmus für Carbon-Gewebe. Erlebe einen Produktionsmonat und vergleiche Lieferkosten, Lagerplatz und Lieferrisiken."><title>Courtline Factory · Dein Lieferplan</title>
<style>
:root{--ink:#153b35;--muted:#536660;--green:#205d4d;--mint:#e5f3eb;--lime:#d6ef8c;--line:#cfdbd4;--bg:#f3f7f4;--orange:#9b510b;--red:#a32b32;--white:#fff}*{box-sizing:border-box}body{margin:0;color:var(--ink);font:18px/1.5 system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg)}button,input{font:inherit}button{min-height:48px;border:1px solid var(--line);padding:11px 20px;background:white;color:var(--ink);border-radius:12px;font-weight:700;cursor:pointer}button:hover{border-color:var(--green);background:#eef6f0}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #d18b19;outline-offset:4px}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:var(--green);border-color:var(--green);color:white}.primary:hover{background:#123f32;color:white}.small{font-size:.88rem;padding:8px 13px}.ghost{background:transparent;border-color:transparent}header{max-width:1200px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:18px 24px;gap:14px;border-bottom:1px solid var(--line)}.brand{font-weight:850;font-size:1.2rem;letter-spacing:-.04em}.brand span{font-weight:450;margin-left:8px}.head-actions{display:flex;gap:4px}main{max-width:1200px;margin:auto;padding:28px 24px 45px}h1{font-size:clamp(2rem,4.3vw,3.5rem);letter-spacing:-.055em;line-height:1.07;margin:12px 0 20px}h2{font-size:1.4rem;line-height:1.25;margin:0 0 15px}h3{font-size:1.05rem;margin:0 0 8px}p{margin:0 0 16px}.eyebrow{text-transform:uppercase;font-size:.78rem;letter-spacing:.12em;font-weight:800;color:var(--green)}.muted{color:var(--muted)}.intro{display:grid;grid-template-columns:1.12fr 1fr;gap:36px;align-items:center}.intro .lead{font-size:1.2rem;max-width:650px}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:24px}.dark{background:var(--ink);color:white;border:0}.dark .muted{color:#c2d5cd}.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:24px 0}.fact{background:white;border:1px solid var(--line);border-radius:14px;padding:16px}.fact b{display:block;font-size:1.65rem;letter-spacing:-.03em;line-height:1.2;margin-bottom:4px}.fact span{font-size:.88rem;color:var(--muted)}.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:22px}.note{border-left:4px solid #8bac95;padding:12px 16px;background:#edf4ef;font-size:.92rem;color:#435b50;margin:20px 0}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:20px 0}.choice{text-align:left;padding:20px;position:relative}.choice strong{display:block;font-size:1.15rem}.choice span{display:block;font-size:.92rem;font-weight:400;margin-top:8px}.choice.active{border:2px solid var(--green);background:var(--mint);padding:19px}.formrow{display:flex;align-items:center;gap:18px;flex-wrap:wrap}.qty{width:110px;font-size:1.7rem;font-weight:750;padding:8px 12px;border:2px solid var(--line);border-radius:12px;text-align:center}.presets{display:flex;gap:8px;flex-wrap:wrap}.presets button[aria-pressed=true]{background:var(--mint);border:2px solid var(--green)}label{font-weight:700;display:block;margin-bottom:10px}.subgrid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.status{border-radius:13px;padding:16px 20px;margin:18px 0;border:1px solid var(--line);background:white}.status.alert{background:#fff3e4;border-color:#ecc694;color:#743b04}.status.bad{background:#fff0ef;border-color:#e7c2c2;color:#81232b}.status.good{background:var(--mint);border-color:#a0c8ad}.status strong{display:block;margin-bottom:4px}.calendar{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:15px 0 20px}.day{background:white;border:1px solid var(--line);border-radius:10px;padding:9px 5px;text-align:center;font-size:.8rem;min-height:69px}.day b{display:block;font-size:.9rem}.day.done{background:#e2efdf;border-color:#b8d3b5}.day.fail{background:#fbe2df;border-color:#d5a1a0}.day.current{outline:3px solid var(--green);outline-offset:0}.day.future{color:#85928b}.weeklabel{font-size:.82rem;color:var(--muted);margin-top:10px}.scene{display:grid;grid-template-columns:.8fr 1.3fr .8fr;gap:14px;align-items:stretch;margin:24px 0}.scene-box{padding:20px 14px;background:white;border:1px solid var(--line);border-radius:16px;text-align:center;overflow:hidden}.scene-box svg{max-width:100%;height:100px}.scene-box .caption{font-weight:750;margin-top:10px}.scene-box .detail{color:var(--muted);font-size:.88rem;margin-top:4px}.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;background:#e7eeea;border-radius:8px;padding:8px;margin-top:10px}.slot{height:37px;border-radius:5px;background:#d0dbd4;border:1px solid #b6c8bd;display:flex;align-items:center;justify-content:center}.roll{display:inline-block;width:28px;height:26px;background:repeating-linear-gradient(45deg,#1b302e 0 3px,#45534d 3px 5px);border-radius:50%;border:3px solid #223e36;box-shadow:3px 0 #758075;position:relative}.roll:after{content:'';position:absolute;inset:6px;border-radius:50%;background:#c6a36f;border:2px solid #e7c999}.spill{background:#fff3df;border:1px dashed #c38e43;border-radius:8px;padding:10px;margin-top:9px;font-size:.85rem}.meter{height:17px;background:#d9e6dd;border-radius:30px;overflow:hidden;margin:12px 0}.meter i{display:block;height:100%;background:var(--green);transition:width .35s}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}.kpi{padding:15px;background:white;border:1px solid var(--line);border-radius:12px}.kpi b{display:block;font-size:1.45rem;line-height:1.2;margin:5px 0}.kpi span{font-size:.85rem;color:var(--muted)}.counter{font-size:2.2rem;font-weight:850;line-height:1.2}.costs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}.costs>div{background:#edf4ef;border-radius:12px;padding:18px}.costs strong{display:block;font-size:1.5rem;margin:8px 0}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px;margin:18px 0}table{border-collapse:collapse;background:white;width:100%;font-size:.95rem}th,td{padding:13px 15px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap}th{background:#e6eee8}tbody tr:last-child td{border:0}td:first-child{white-space:normal;min-width:170px}.tag{display:inline-block;border-radius:30px;padding:4px 10px;font-size:.8rem;background:#e1ecdf;margin-bottom:5px}.tag.risk{background:#ffe4db}.empty{padding:30px;text-align:center;color:var(--muted)}.checklist{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.check{padding:8px 13px;border-radius:40px;border:1px solid var(--line);background:white;font-size:.85rem}.check.yes{background:var(--mint);border-color:#9bc6a6}.summaryline{font-size:1.05rem;max-width:900px}.hidden{display:none!important}footer{max-width:1200px;margin:auto;padding:22px 24px;border-top:1px solid var(--line);font-size:.78rem;color:var(--muted)}.moving{animation:drive .8s ease-in-out}.rotating{animation:spin .8s linear infinite}.pulse{animation:pulse .6s ease-in-out}.validation{color:var(--red);font-weight:700;margin-top:10px}.stopped{color:var(--red)}.hero-svg{width:100%;max-height:300px}.badge{display:inline-block;background:var(--lime);color:var(--ink);padding:6px 11px;border-radius:7px;font-weight:750;font-size:.82rem;margin:8px 0}.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;padding:12px 22px;border-radius:12px;z-index:10;max-width:92vw;text-align:center}.sr{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0)}@keyframes drive{0%{transform:translateX(-18px)}100%{transform:translateX(18px)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{transform:scale(1.04)}}@media(max-width:850px){.intro{grid-template-columns:1fr;gap:20px}.facts,.kpis{grid-template-columns:repeat(2,1fr)}.subgrid{grid-template-columns:1fr}.scene{grid-template-columns:1fr 1.4fr}.scene-box.production{grid-column:1/-1;display:grid;grid-template-columns:100px 1fr;gap:15px;align-items:center;text-align:left}.production svg{height:85px}.production .caption{margin:0}.intro .dark{padding:20px}.costs{grid-template-columns:1fr}.costs>div{display:flex;align-items:center;justify-content:space-between;gap:15px}.costs strong{margin:0;white-space:nowrap}.choices{gap:9px}.choice{padding:15px}.choice.active{padding:14px}}@media(max-width:540px){body{font-size:16px}header{padding:12px 15px;align-items:flex-start}.brand span{display:block;margin:0;font-size:.9rem}.head-actions{gap:0}.head-actions button{padding:8px}.head-actions .small{font-size:.78rem}main{padding:22px 15px}.card{padding:18px}.choices{grid-template-columns:1fr}.choice span{margin-top:3px}.facts,.kpis{gap:8px}.fact,.kpi{padding:12px}.scene{gap:8px;grid-template-columns:1fr}.scene-box.production{grid-column:auto}.scene-box.supplier{display:flex;text-align:left;align-items:center;gap:12px}.supplier svg{height:65px;width:100px}.scene-box{padding:14px}.slots{gap:5px}.slot{height:34px}.calendar{gap:4px}.day{font-size:.7rem;padding:7px 2px}.day b{font-size:.78rem}.costs>div{font-size:.9rem;padding:13px}.costs strong{font-size:1.25rem}h1{font-size:2.2rem}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body><header><div class="brand">Courtline<span>Factory</span></div><div class="head-actions"><button class="small ghost" data-action="compare">Planvergleich</button><button class="small ghost" data-action="reset">Neu starten</button></div></header><main id="app"></main><div id="announce" class="sr" role="status" aria-live="polite"></div><footer>Fiktives Unterrichtsmodell · BwR 8 (II) · Kein Login. Fortschritt nur in diesem Browser. Keine Übertragung an die Lehrkraft.</footer>
<script>
/* MODEL_START */
const RULES=Object.freeze({days:20,dailyRackets:5,capacity:15,deliveryCost:20,rent:200});
const CADENCES=Object.freeze({month:{label:'Monatlich',step:20},week:{label:'Wöchentlich',step:5},day:{label:'Täglich',step:1}});
function simulate(cadence,quantity,disruption=false){
 if(!CADENCES[cadence]||!Number.isInteger(quantity)||quantity<1||quantity>30)throw Error('Ungültiger Lieferplan');
 let stock=0,made=0,missed=0,deliveries=0,peak=0,overflow=false,pending=0;const days=[];
 for(let d=0;d<RULES.days;d++){
  const scheduled=d%CADENCES[cadence].step===0?quantity:0;
  const delayed=disruption&&d===7?scheduled:0;
  const overdue=pending;pending=delayed;
  const incoming=scheduled-delayed+overdue;
  const arrivals=(scheduled>0&&delayed===0?1:0)+(overdue>0?1:0);
  stock+=incoming;deliveries+=arrivals;peak=Math.max(peak,stock);const before=stock;
  const newOverflow=stock>RULES.capacity&&!overflow;overflow=overflow||stock>RULES.capacity;
  const used=Math.min(stock,1);stock-=used;const produced=used*RULES.dailyRackets;made+=produced;missed+=RULES.dailyRackets-produced;
  days.push({day:d,week:Math.floor(d/5)+1,weekday:d%5,scheduled,incoming,delayed,overdue,arrivals,before,stock,produced,made,missed,deliveries,newOverflow,overflow});
 }
 return {cadence,quantity,disruption,days,made,missed,stock,deliveries,peak,overflow,ordered:quantity*(20/CADENCES[cadence].step),deliveryCost:deliveries*RULES.deliveryCost,rentCost:overflow?RULES.rent:0,cost:deliveries*RULES.deliveryCost+(overflow?RULES.rent:0)};
}
/* MODEL_END */

const KEY='courtline-factory-v2',app=document.querySelector('#app'),names=['Mo','Di','Mi','Do','Fr'];
let state={screen:'intro',cadence:'month',quantity:15,history:[],run:null,cursor:0},timer=null,running=false;
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.history)&&['intro','plan','sim','report','compare','rules'].includes(s.screen)&&CADENCES[s.cadence]&&Number.isInteger(s.quantity)&&s.quantity>=1&&s.quantity<=30){state={...state,...s};state.history=state.history.filter(r=>CADENCES[r.cadence]&&Number.isInteger(r.quantity)&&r.quantity>=1&&r.quantity<=30).slice(-12);if(state.run){state.run=simulate(state.run.cadence,state.run.quantity,!!state.run.disruption);state.cursor=Math.max(0,Math.min(20,state.cursor|0));}}}catch(e){}
const cash=n=>n.toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
const truck=`<svg viewBox="0 0 200 110" aria-hidden="true"><path d="M8 20h110v63H8z" fill="#d1e3d8"/><path d="M118 42h40l30 30v11h-70z" fill="#205d4d"/><path d="M130 48h23l19 20h-42z" fill="#bbdfd6"/><circle cx="44" cy="86" r="15" fill="#173e38"/><circle cx="155" cy="86" r="15" fill="#173e38"/><circle cx="44" cy="86" r="6" fill="#e6efea"/><circle cx="155" cy="86" r="6" fill="#e6efea"/><text x="19" y="56" font-size="18" fill="#173e38" font-family="Arial" font-weight="bold">Courtline</text></svg>`;
const factory=`<svg viewBox="0 0 200 115" aria-hidden="true"><path d="M10 100V52l52-25v25l53-25v25h75v48z" fill="#c7ded0"/><path d="M145 50V10h18v40" fill="#205d4d"/><path d="M30 71h22v15H30zm43 0h22v15H73zm43 0h22v15h-22z" fill="#43816b"/><path d="M160 73h18v27h-18z" fill="#173e38"/></svg>`;
const hero=`<svg class="hero-svg" viewBox="0 0 490 255" aria-hidden="true"><path d="M26 222h438" stroke="#adcbb8" stroke-width="4"/><path d="M45 215V44h227v171M45 100h227M45 158h227" fill="none" stroke="#e6f3e9" stroke-width="10"/>${[0,1,2].flatMap(y=>[0,1,2,3].map(x=>`<g transform="translate(${74+x*55} ${75+y*57})"><ellipse rx="21" ry="18" fill="#8aab96"/><ellipse rx="14" ry="17" fill="#304e42"/><ellipse rx="6" ry="8" fill="#dcbd86"/></g>`)).join('')}<rect x="293" y="158" width="160" height="57" rx="8" fill="#d6ef8c"/><text x="373" y="194" text-anchor="middle" font-family="Arial" font-size="25" font-weight="bold" fill="#153b35">15 Rollen</text><path d="M322 140l40-45 40 45" fill="none" stroke="#d6ef8c" stroke-width="6"/></svg>`;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
function stop(){clearTimeout(timer);timer=null;running=false;}
function go(screen){stop();state.screen=screen;save();render();window.scrollTo({top:0,behavior:'instant'});}
function checklist(){const tested=new Set(state.history.filter(r=>!r.disruption).map(r=>r.cadence));return '<div class="checklist">'+Object.keys(CADENCES).map(c=>`<span class="check ${tested.has(c)?'yes':''}">${tested.has(c)?'✓ ':''}${CADENCES[c].label} testen</span>`).join('')+`<span class="check ${state.history.some(r=>r.disruption)?'yes':''}">${state.history.some(r=>r.disruption)?'✓ ':''}Lieferstörung untersuchen</span></div>`;}
function intro(){return `<div class="intro"><section><div class="eyebrow">Du planst. Courtline produziert.</div><h1>Voller Auftrag.<br>Volles Lager.<br>Deine Entscheidung.</h1><p class="lead">Jonas braucht einen besseren Lieferplan für Carbon-Gewebe. Halte die Fertigung am Laufen und behalte die Kosten im Blick.</p><div class="actions"><button class="primary" data-action="plan">Lieferplan entwickeln</button><button data-action="rules">Spielregeln ansehen</button></div></section><section class="card dark">${hero}<h2>So viel Platz ist vorhanden.</h2><p class="muted">In Courtlines Lager passen höchstens <strong>15 Rollen</strong>. Wenn mehr Material gleichzeitig ankommt, muss für diesen Monat zusätzlicher Lagerplatz angemietet werden.</p></section></div>${facts()}<div class="note">Dein Auftrag: Teste monatliche, wöchentliche und tägliche Lieferungen. Vergleiche danach, ob der Plan die Produktion schafft und welche Liefer- und Zusatzlagerkosten entstehen. Zum Schluss prüfst du eine Lieferstörung.</div>`;}
function facts(){return `<div class="facts"><div class="fact"><b>100</b><span>Padelschläger im Monat</span></div><div class="fact"><b>5 pro Tag</b><span>20 Arbeitstage · 4 Wochen</span></div><div class="fact"><b>1 Rolle</b><span>reicht für 5 Padelschläger</span></div><div class="fact"><b>15 Rollen</b><span>vorhandener Lagerplatz</span></div></div>`;}
function rules(){return `<div class="eyebrow">Das vereinfachte Modell</div><h1>Dein Planungsbüro.</h1>${facts()}<div class="subgrid"><section class="card"><h2>Material und Fertigung</h2><p>Der Monat beginnt mit leerem Lager. Geliefert wird vor der Fertigung. Für fünf Schläger wird eine Rolle vollständig verarbeitet. Alle anderen Werkstoffe sind vorhanden.</p><p>Monatlich: Lieferung am ersten Montag. Wöchentlich: jeweils montags. Täglich: Montag bis Freitag. Die gewählte Rollenmenge gilt <strong>je Lieferung</strong>.</p><p>Liefertermine werden im Voraus vereinbart. Just-in-Time bedeutet nicht, jeden Morgen erst spontan zu bestellen.</p></section><section class="card"><h2>Was kostet dein Plan?</h2><p><strong>${cash(20)} je Anlieferung.</strong> Jede tatsächliche Anlieferung wird gezählt.</p><p><strong>${cash(200)} Zusatzlager pro Monat</strong>, sobald vor der Verarbeitung mehr als 15 Rollen gleichzeitig da sind. Die Miete bleibt für den ganzen Monat bestehen.</p><p>Verglichen werden nur Liefer- und Zusatzlagerkosten. Materialpreise, normale Lagerkosten und Folgekosten eines Stillstands werden nicht berechnet. Restmaterial bindet zusätzlich Geld.</p></section></div><div class="note">Störfall: In Woche 2 ist die Zufahrt am Mittwoch blockiert. Eine an diesem Tag vorgesehene Lieferung kommt erst am Donnerstag, zusätzlich zur regulären Lieferung. Tageskapazität: 5 Schläger. Versäumte Tagesproduktion wird in diesem Modell nicht automatisch nachgeholt.</div><div class="actions"><button class="primary" data-action="plan">Zum Lieferplan</button></div>`;}
function plan(){const pre=state.cadence==='month'?[15,20,25]:state.cadence==='week'?[3,5,10]:[1,2,3];return `<div class="eyebrow">Planungsbüro · Carbon-Gewebe</div><h1>Wann kommt wie viel?</h1><p class="summaryline">Plane die Materialversorgung für alle 100 Padelschläger. Du hast 15 Lagerplätze und startest ohne Vorrat.</p>${checklist()}<h2>1. Wähle den Lieferrhythmus.</h2><div class="choices">${Object.entries(CADENCES).map(([k,v])=>`<button class="choice ${state.cadence===k?'active':''}" data-action="cadence" data-value="${k}" aria-pressed="${state.cadence===k}"><strong>${v.label}</strong><span>${k==='month'?'Einmal zu Monatsbeginn':k==='week'?'An jedem Montag':'An jedem Arbeitstag'}</span></button>`).join('')}</div><section class="card"><label for="quantity">2. Wie viele Rollen sollen je Lieferung kommen?</label><div class="formrow"><input class="qty" id="quantity" type="number" inputmode="numeric" min="1" max="30" step="1" value="${state.quantity}" aria-describedby="quantityHint"><div class="presets">${pre.map(n=>`<button data-action="quantity" data-value="${n}" aria-pressed="${n===state.quantity}">${n} Rollen</button>`).join('')}</div></div><p class="muted" id="quantityHint" style="margin-top:14px">Wähle einen Vorschlag oder gib 1 bis 30 ganze Rollen ein. Deine Menge kommt ${state.cadence==='month'?'einmal':state.cadence==='week'?'viermal':'20-mal'} im Monat.</p><div id="error" class="validation" role="alert"></div></section><div class="note">Jede Anlieferung: ${cash(20)} · Zusatzlager bei mehr als 15 Rollen gleichzeitig: ${cash(200)} für den Monat. Überlege erst selbst, welche Menge zu deinem Plan passt.</div><div class="actions"><button class="primary" data-action="start">Plan im Monat ausprobieren</button><button data-action="rules">Modell nachlesen</button></div>`;}
function warehouse(stock){return `<div class="slots" aria-label="${Math.min(15,stock)} von 15 Lagerplätzen belegt">${Array.from({length:15},(_,i)=>`<div class="slot">${i<stock?'<i class="roll" aria-hidden="true"></i>':''}</div>`).join('')}</div>${stock>15?`<div class="spill"><strong>Zusatzlager: ${stock-15} Rollen</strong><br>Diese Menge passt gerade nicht in die Fertigungshalle.</div>`:''}`;}
function scene(day,r){const stock=day?day.stock:0;const arrived=day?day.incoming:0;return `<div class="scene"><section class="scene-box supplier"><div class="${running&&arrived?'moving':''}">${truck}</div><div><div class="caption">Lieferer</div><div class="detail">${day?(day.delayed?'Heute verspätet!':arrived?arrived+' '+(arrived===1?'Rolle angekommen':'Rollen angekommen'):'Heute keine Lieferung'):'Lieferplan steht bereit'}</div></div></section><section class="scene-box"><div class="caption">Lager · ${stock} ${stock===1?'Rolle':'Rollen'}</div><div class="detail">15 Plätze in der Fertigungshalle</div>${warehouse(stock)}${r&&r.days.slice(0,state.cursor).some(d=>d.overflow)&&stock<=15?'<div class="detail">Zusatzlager bleibt für diesen Monat angemietet.</div>':''}</section><section class="scene-box production">${factory}<div><div class="caption">Fertigung</div><div class="detail">${day?day.produced+' von 5 Schlägern heute':'Ziel: 5 Schläger je Tag'}</div></div></section></div>`;}
function calendar(r){return Array.from({length:4},(_,w)=>`<div class="weeklabel">Woche ${w+1}</div><div class="calendar">${r.days.slice(w*5,w*5+5).map(d=>`<div class="day ${d.day<state.cursor?(d.produced===5?'done':'fail'):'future'} ${d.day===state.cursor-1?'current':''}"><b>${names[d.weekday]} · ${d.day+1}.</b>${d.day<state.cursor?d.produced+' Schläger':'noch offen'}</div>`).join('')}</div>`).join('');}
function sim(){const r=state.run,d=state.cursor?r.days[state.cursor-1]:null;let message='Prüfe deinen Plan. Dann lass die erste Produktionswoche laufen.',kind='';if(d){message=d.delayed?'Stau am Mittwoch: Die geplante Lieferung kommt erst morgen. '+(d.produced===0?'Ohne Material steht heute die Fertigung.':'Dein vorhandener Vorrat reicht für die heutige Fertigung aus.'):d.newOverflow?'Die Lieferung passt nicht vollständig ins Lager. Courtline mietet jetzt Zusatzfläche für '+cash(200)+' an.':d.produced===0?'Material fehlt! Heute werden keine Schläger fertig. Die versäumte Tagesmenge wird im Modell nicht nachgeholt.':d.overdue?'Die verspätete Lieferung ist angekommen – zusammen mit der regulären Lieferung. Heute sind trotzdem höchstens fünf Schläger möglich.':d.incoming?'Material angekommen und verarbeitet. Heute sind fünf Schläger fertig.':'Aus dem Vorrat werden heute fünf Schläger gefertigt.';kind=d.produced===0?'bad':d.newOverflow?'alert':'good';}
return `<div class="eyebrow">${r.disruption?'Störfall · gleicher Lieferplan':'Dein Produktionsmonat'} · ${CADENCES[r.cadence].label} · ${r.quantity} ${r.quantity===1?'Rolle':'Rollen'} je Lieferung</div><h1>${d?'Woche '+d.week+' · '+['Montag','Dienstag','Mittwoch','Donnerstag','Freitag'][d.weekday]:'Dein Plan geht in Betrieb.'}</h1><div class="status ${kind}" role="status"><strong>${d?'Arbeitstag '+state.cursor+' von 20':'Bereit für den Monatsstart'}</strong>${message}</div>${scene(d,r)}<div class="kpis"><div class="kpi"><span>Schläger gefertigt</span><b>${d?d.made:0} / 100</b></div><div class="kpi"><span>Bisher ausgefallen</span><b>${d?d.missed:0} Schläger</b></div><div class="kpi"><span>Anlieferungen bisher</span><b>${d?d.deliveries:0}</b></div><div class="kpi"><span>Liefer- und Zusatzlagerkosten</span><b>${cash((d?d.deliveries:0)*20+(d&&d.overflow?200:0))}</b></div></div><div class="actions">${state.cursor<20?`<button class="primary" data-action="advance" ${running?'disabled':''}>${state.cursor%5===0?'Woche '+(Math.floor(state.cursor/5)+1)+' simulieren':'Woche fortsetzen'}</button>${running?'<button data-action="pause">Pause</button>':''}`:'<button class="primary" data-action="result">Monat auswerten</button>'}<span class="muted">${running?'Die Produktion läuft …':(state.cursor%5?'Besprich die Situation und setze die Woche anschließend fort.':'Nach jeder Woche hält die Simulation an.')}</span></div><details style="margin-top:22px"><summary>Monatskalender ansehen</summary>${calendar(r)}</details>`;}
function feedback(r){let a=[];if(r.missed)a.push(`<div class="status bad"><strong>${r.made} von 100 Schlägern fertig.</strong>Für ${r.missed} Schläger war am benötigten Tag kein Material verfügbar.${r.cadence==='month'&&r.quantity===15?' Deine 15 Rollen passen genau ins Lager, reichen aber nur für die ersten drei Wochen.':''}</div>`);else a.push('<div class="status good"><strong>Produktionsziel erreicht: 100 von 100 Schlägern.</strong>Für jeden Arbeitstag war ausreichend Material verfügbar.</div>');a.push(`<div class="status ${r.overflow?'alert':'good'}"><strong>${r.overflow?'Zusatzlager erforderlich.':'Vorhandener Lagerplatz reicht aus.'}</strong>${r.overflow?'Vor der Verarbeitung waren höchstens '+r.peak+' Rollen gleichzeitig da. Das überschreitet die 15 Plätze. Die Zusatzmiete gilt für den ganzen Monat.':'Der höchste Bestand vor der Verarbeitung lag bei '+r.peak+' '+(r.peak===1?'Rolle':'Rollen')+'; es sind 15 Plätze vorhanden.'}</div>`);if(r.stock)a.push(`<div class="status alert"><strong>${r.stock} ${r.stock===1?'Rolle bleibt':'Rollen bleiben'} übrig.</strong>${r.stock===1?'Sie ist nicht verbraucht und bindet':'Sie sind nicht verbraucht und binden'} weiterhin Geld. Prüfe, ob eine kleinere Liefermenge die Produktion ebenfalls schaffen würde.</div>`);if(r.disruption)a.push(`<div class="note">Am Mittwoch der zweiten Woche war für alle Pläne dieselbe Zufahrt blockiert. ${r.cadence==='day'?'Deine für diesen Tag geplante Lieferung kam erst am Donnerstag. Ein vorhandener Vorrat konnte die Störung '+(r.missed?'nicht vollständig':'in diesem Versuch')+' überbrücken.':'Bei diesem Lieferrhythmus war am Mittwoch keine Anlieferung vorgesehen. Vorhandener Vorrat kann die Fertigung gegen solche Störungen absichern.'} Versäumte Produktion wird hier nicht automatisch nachgeholt.</div>`);return a.join('');}
function costs(r){return `<div class="costs"><div><span>${r.deliveries} ${r.deliveries===1?'Anlieferung':'Anlieferungen'} × ${cash(20)}</span><strong>${cash(r.deliveryCost)}</strong></div><div><span>Zusatzlager für den Monat</span><strong>${cash(r.rentCost)}</strong></div><div><span>Betrachtete Kosten zusammen</span><strong>${cash(r.cost)}</strong></div></div><p class="muted">Nur Liefer- und Zusatzlagerkosten. Kein vollständiger Gesamtkostenvergleich. Ein billiger Plan mit fehlendem Material erfüllt den Produktionsauftrag nicht.</p>`;}
function report(){const r=state.run;const title=r.missed?'Dein Plan hat eine Lücke.':r.overflow?'Produktion geschafft. Lager zu klein.':'Dein Plan trägt die Produktion.';return `<div class="eyebrow">Monatsauswertung · ${CADENCES[r.cadence].label} · ${r.quantity} ${r.quantity===1?'Rolle':'Rollen'} je Lieferung${r.disruption?' · mit Störung':''}</div><h1>${title}</h1>${feedback(r)}<h2>Was kostet diese Versorgung?</h2>${costs(r)}<div class="actions"><button class="primary" data-action="plan">Lieferplan verändern</button><button data-action="compare">Meine Pläne vergleichen</button>${!r.disruption?'<button data-action="disruption">Diesen Plan mit Lieferstörung testen</button>':'<button data-action="baseline">Diesen Plan ohne Störung testen</button>'}</div>${checklist()}<details><summary>Alle 20 Arbeitstage nachlesen</summary>${daytable(r)}</details>`;}
function daytable(r){return `<div class="tablewrap"><table><thead><tr><th>Arbeitstag</th><th>Rollen geliefert</th><th>Rollen vor Fertigung</th><th>Schläger fertig</th><th>Rollen übrig</th></tr></thead><tbody>${r.days.map(d=>`<tr><td>W${d.week} · ${names[d.weekday]}${d.delayed?' · Stau':''}</td><td>${d.incoming}</td><td>${d.before}</td><td>${d.produced}</td><td>${d.stock}</td></tr>`).join('')}</tbody></table></div>`;}
function compare(){const hs=state.history.map(h=>simulate(h.cadence,h.quantity,h.disruption));const complete=new Set(hs.filter(r=>!r.disruption).map(r=>r.cadence)).size===3&&hs.some(r=>r.disruption);return `<div class="eyebrow">Deine Versuche im Überblick</div><h1>${complete?'Jetzt berätst du Simon.':'Vergleichen statt raten.'}</h1><p class="summaryline">Vergleiche zuerst die Erfüllung des Produktionsauftrags. Wäge dann Lagerplatz, Kosten und Lieferzuverlässigkeit ab.</p>${checklist()}${hs.length?`<div class="tablewrap"><table><thead><tr><th>Lieferplan</th><th>Fertigung</th><th>Restbestand</th><th>Lieferungen</th><th>Lieferkosten</th><th>Zusatzlager</th><th>Summe</th></tr></thead><tbody>${hs.map(r=>`<tr><td><span class="tag ${r.disruption?'risk':''}">${r.disruption?'Störung getestet':'Normaler Monat'}</span><br><strong>${CADENCES[r.cadence].label}</strong> · ${r.quantity} ${r.quantity===1?'Rolle':'Rollen'}</td><td>${r.made} / 100</td><td>${r.stock} ${r.stock===1?'Rolle':'Rollen'}</td><td>${r.deliveries}</td><td>${cash(r.deliveryCost)}</td><td>${cash(r.rentCost)}</td><td><strong>${cash(r.cost)}</strong></td></tr>`).join('')}</tbody></table></div>`:'<div class="card empty">Hier erscheinen deine abgeschlossenen Versuche. Entwickle zuerst einen Lieferplan.</div>'}<p class="muted">Bei Bedarf kannst du die Vergleichstabelle seitlich verschieben.</p><section class="card"><h2>Deine Empfehlung an Simon</h2><p>Begründe, welchen Lieferplan du Courtline empfiehlst. Berücksichtige die Produktion, die betrachteten Kosten und das Risiko verspäteter Lieferungen.</p><p class="muted">Besprich deine Empfehlung mit deinem Partner oder deiner Partnerin. Sichere eure Ergebnisse auf dem Arbeitsblatt oder mit einem Screenshot.</p></section><div class="note">Bedarfsgerechte Lieferungen zum Fertigungsbeginn heißen <strong>Just-in-Time</strong>. Sie können Lagerbestände senken. Häufigere Lieferungen kosten aber ebenfalls Geld und erfordern zuverlässige Abstimmung. Ein Sicherheitsbestand kann begrenzte Störungen überbrücken. Das günstigste Ergebnis dieses Modells ist keine allgemeine Regel für echte Unternehmen.</div><div class="actions"><button class="primary" data-action="plan">Weiteren Plan testen</button><button data-action="rules">Modellgrenzen nachlesen</button></div><p class="muted" style="margin-top:18px">Die letzten zwölf unterschiedlichen Versuche bleiben in diesem Browser gespeichert. Du kannst deine Empfehlung selbst dokumentieren; sie wird nicht an die Lehrkraft übertragen.</p>`;}
function render(){app.innerHTML=({intro,plan,sim,report,compare,rules}[state.screen]||intro)();}
function start(disruption=false){stop();state.run=simulate(state.cadence,state.quantity,disruption);state.cursor=0;go('sim');}
function finish(){const r=state.run;const id=r.cadence+':'+r.quantity+':'+r.disruption;state.history=state.history.filter(h=>h.cadence+':'+h.quantity+':'+h.disruption!==id);state.history.push({cadence:r.cadence,quantity:r.quantity,disruption:r.disruption});state.history=state.history.slice(-12);go('report');}
function tick(end){if(!running)return;if(state.cursor<end){state.cursor++;save();render();const d=state.run.days[state.cursor-1];document.querySelector('#announce').textContent='Woche '+d.week+', '+names[d.weekday]+': '+d.produced+' Schläger fertig, '+d.stock+' '+(d.stock===1?'Rolle':'Rollen')+' übrig.';if(d.delayed||d.newOverflow||(d.produced===0&&!state.run.days.slice(0,state.cursor-1).some(x=>x.produced===0))){stop();save();render();return;}timer=setTimeout(()=>tick(end),650);}else{stop();save();if(state.cursor===20)finish();else render();}}
document.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;if(['plan','compare','rules'].includes(a)){go(a);return;}if(a==='reset'){if(confirm('Alle Versuche und den Spielstand in diesem Browser löschen und neu beginnen?')){stop();state={screen:'intro',cadence:'month',quantity:15,history:[],run:null,cursor:0};save();render();}return;}if(a==='cadence'){state.cadence=b.dataset.value;state.quantity=state.cadence==='month'?15:state.cadence==='week'?5:1;save();render();return;}if(a==='quantity'){state.quantity=Number(b.dataset.value);save();render();return;}if(a==='start'){const v=document.querySelector('#quantity').value.trim();const n=Number(v);if(!v||!Number.isInteger(n)||n<1||n>30){document.querySelector('#error').textContent='Gib bitte eine ganze Rollenmenge zwischen 1 und 30 ein.';document.querySelector('#quantity').focus();return;}state.quantity=n;start();return;}if(a==='advance'){running=true;const end=Math.min(20,(Math.floor(state.cursor/5)+1)*5);tick(end);return;}if(a==='pause'){stop();save();render();return;}if(a==='result'){finish();return;}if(a==='disruption'||a==='baseline'){state.cadence=state.run.cadence;state.quantity=state.run.quantity;start(a==='disruption');return;}});
document.addEventListener('change',e=>{if(e.target.id==='quantity'){const n=Number(e.target.value);if(Number.isInteger(n)&&n>=1&&n<=30){state.quantity=n;save();}}});
window.addEventListener('pagehide',()=>{stop();save();});render();
</script></body></html>
